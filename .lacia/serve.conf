# このリポジトリーのレイシアの設定です。書けるのは、呼び名や予定の連携など、
# 記録の側に任せてよいものだけです。待ち受けるアドレスや、起動するコマンドは、
# make install が作る ~/.config/lacia/serve.conf に書きます。

label = レイシア

# Google Calendar を読むための、OAuth のクライアントです。デスクトップ アプリの種類で、
# 連携は PKCE で守られます。自分で用意したクライアントを使うときは、ファイルを差し替えるか、
# 別の場所を指定します。
google-client = .lacia/google-client.json

# 読むカレンダーを決めたら、次の行の # を外して、ファイルを用意します。
# calendars = .lacia/calendars.json
