# このリポジトリーのレイシアの設定です。書けるのは、プロファイルの表示名や予定の連携など、
# 記録の側に任せてよいものだけです。待ち受けるアドレスや、起動するコマンドは、
# make install が作る ~/.config/lacia/serve.conf に書きます。

label = レイシア

# Google Calendar の予定を読むカレンダーは、lacia init が .lacia/calendars.json に書きます。
# 足したり変えたりするときは、そのファイルを直します。

# 連携に使う OAuth のクライアントは、lacia に入っています。自分で用意したクライアントを
# 使うときは、JSON を置いて、次の行の # を外します。
# google-client = .lacia/google-client.json
