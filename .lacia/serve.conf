# ここには、プロファイルの表示名や予定の連携など、記録のリポジトリーで管理する設定を書きます。
# サーバーが待ち受けるアドレスや起動するコマンドは、make install が作る
# ~/.config/lacia/serve.conf に書いてください。

label = レイシア

# lacia init は、予定を読むGoogleアカウントを .lacia/calendars.json に登録します。
# カレンダーを追加したり変更したりするときは、このファイルを編集してください。

# 手元のMacでは、予定の連携にlacia付属のOAuthクライアントを使えます。
# ご自分のクライアントを使うには、次のパスにJSONファイルを置き、行頭の # を外してください。
# google-client = .lacia/google-client.json
